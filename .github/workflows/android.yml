name: Zniff Android
on:
  push:
    branches: [android-build]
    paths-ignore: ['ut/**']
permissions:
  contents: write
jobs:
  bygg:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Lag prosjektet
        run: |
          set -o pipefail
          mkdir -p ut
          npm install --no-audit --no-fund 2>&1 | tail -5 | tee ut/logg.txt
          node gen.js android 2>&1 | tee -a ut/logg.txt
      - name: Bygg pakken
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease 2>&1 | tail -150 | tee -a ../ut/logg.txt
      - name: Hent pakken
        run: |
          cp "$(find android/app/build/outputs -name '*.aab' | head -1)" ut/zniff-usignert.aab
          ls -la ut | tee -a ut/logg.txt
      - name: Lagre resultatet i grenen
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ut
          git commit -m "Bygg ${{ github.run_number }}: ${{ job.status }} [skip ci]" || exit 0
          git push
